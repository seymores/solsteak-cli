[package]
name = "ssteak"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"

[dependencies]
base64 = "0.23.1"
bs58 = "0.5.1"
clap = { version = "4.6.7", default-features = false, features = ["std", "help", "usage"] }
crossterm = "0.29.0"
directories = "6.0.0"
httpdate = "1.0.3"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "std"] }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls", "query"] }
rusqlite = { version = "0.40.2", features = ["bundled", "backup"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
signal-hook = "0.4.5"
